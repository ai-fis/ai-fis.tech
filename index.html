<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-FIS Technologies Inc.</title>
  <meta
    name="description"
    content="AI-FIS Technologies Inc. — Governed Assistive Intelligence. Observation before action."
  />
  <style>
    :root {
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.84);
      --soft: rgba(255, 255, 255, 0.62);
      --gold: #e6c98f;
      --dark: #07111f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--dark);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(
          to bottom,
          rgba(7, 17, 31, 0.55),
          rgba(7, 17, 31, 0.35) 42%,
          rgba(7, 17, 31, 0.85)
        ),
        linear-gradient(rgba(7, 17, 31, 0.52), rgba(7, 17, 31, 0.52)),
        url("./bridge-landing.jpg");
      background-size: cover;
      background-position: center;
    }

    .shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 2rem 1.75rem 1.5rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.04em;
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      white-space: nowrap;
    }

    .mark {
      width: 2.3rem;
      height: 2.3rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      padding-left: 0.18em;
    }

    .menu {
      width: 2.75rem;
      height: 2.75rem;
      border: 0;
      background: transparent;
      display: grid;
      gap: 0.35rem;
      align-content: center;
      justify-content: center;
      cursor: default;
    }

    .menu span {
      display: block;
      width: 1.65rem;
      height: 1px;
      background: rgba(255, 255, 255, 0.82);
    }

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 0 2rem;
    }

    .hero-inner {
      max-width: 48rem;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 11vw, 7rem);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: 0.045em;
      text-wrap: balance;
    }

    .tagline {
      margin: 1.8rem 0 0;
      font-size: clamp(1.15rem, 4vw, 1.75rem);
      font-style: italic;
      color: rgba(255, 244, 214, 0.92);
      letter-spacing: 0.04em;
    }

    .rule {
      width: 4.4rem;
      height: 1px;
      margin: 1.65rem auto 0;
      background: rgba(230, 201, 143, 0.85);
    }

    .subline {
      margin: 1.65rem auto 0;
      max-width: 42rem;
      font-size: clamp(1.35rem, 4.5vw, 2.2rem);
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.02em;
    }

    .footer {
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      padding-top: 1.6rem;
      color: var(--muted);
    }

    .footer p {
      margin: 0;
      font-size: clamp(1rem, 3.5vw, 1.18rem);
      line-height: 1.7;
      letter-spacing: 0.03em;
    }

    .footer a {
      display: inline-block;
      margin-top: 0.2rem;
      color: rgba(255, 244, 214, 0.95);
      text-decoration: none;
      font-size: clamp(1.05rem, 3.6vw, 1.25rem);
      letter-spacing: 0.05em;
    }

    .languages {
      margin-top: 2.2rem !important;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: 0.1em !important;
    }

    .dot {
      color: rgba(255, 255, 255, 0.36);
      margin: 0 0.75rem;
    }

    @media (min-width: 760px) {
      .shell {
        padding: 2.5rem 4rem 2rem;
      }

      .hero {
        justify-content: flex-start;
        text-align: left;
      }

      .hero-inner {
        margin: 0;
      }

      .rule {
        margin-left: 0;
      }

      .subline {
        margin-left: 0;
      }

      .footer {
        max-width: 48rem;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="shell" aria-label="AI-FIS Bridge Landing Page">
      <header class="topbar">
        <div class="brand" aria-label="AI-FIS Technologies Inc.">
          <div class="mark" aria-hidden="true">AI</div>
          <div>AI-FIS Technologies Inc.</div>
        </div>

        <button class="menu" type="button" aria-label="Menu placeholder">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>

      <section class="hero">
        <div class="hero-inner">
          <h1>Governed Assistive Intelligence</h1>
          <p class="tagline">Observation before action.</p>
          <div class="rule" aria-hidden="true"></div>
          <p class="subline">Bounded observability before commitment.</p>
        </div>
      </section>

      <footer class="footer">
        <p>For academic, legal, and institutional inquiries:</p>
        <a href="mailto:inquiries@ai-fis.tech">inquiries@ai-fis.tech</a>

        <p class="languages">
          English <span class="dot">•</span> Kiswahili <span class="dot">•</span> Français
        </p>
      </footer>
    </section>
  </main>
</body>
</html>
